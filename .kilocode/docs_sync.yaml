# Docs Sync Configuration
# This file defines the mapping between code/config locations and documentation targets.
# It also specifies extractors and verification commands for documentation generation.

---

# Watch globs: Patterns to watch for changes in code/config locations
watch_globs:
  - "src/**/*.py"              # All Python source files
  - "config/**/*.yaml"          # Configuration files
  - "config/**/*.yml"           # Configuration files (alternative extension)
  - "config/**/*.json"          # JSON configuration files
  - "cli/**/*.py"               # CLI-related source files
  - "scripts/**/*.py"           # Script files
  - "migrations/**/*.sql"       # Database migration files
  - "specs/**/*.md"             # Specification documents

# Doc targets: Documentation targets per area
doc_targets:
  - area: "API Reference"
    target: "docs/api-reference.md"
    description: "Generated API reference documentation"

  - area: "Configuration"
    target: "docs/configuration.md"
    description: "Configuration documentation"

  - area: "CLI Help"
    target: "docs/cli-help.md"
    description: "CLI command reference"

  - area: "Architecture"
    target: "docs/architecture.md"
    description: "System architecture documentation"

  - area: "Development Guide"
    target: "docs/development-guide.md"
    description: "Development guidelines and best practices"

  - area: "Testing Guide"
    target: "docs/testing-guide.md"
    description: "Testing guidelines and procedures"

  - area: "Operations"
    target: "docs/operations.md"
    description: "Operational procedures and runbook"

# Extractors: Tools/commands to extract documentation from code
extractors:
  - name: "CLI Help Extractor"
    command: "python -m cli --help"
    output: "docs/cli-help.md"
    description: "Extracts CLI help text"

  - name: "Schema Docs Extractor"
    command: "python scripts/extract_schema_docs.py"
    output: "docs/schema-docs.md"
    description: "Extracts schema documentation from code"

  - name: "Environment Variables Extractor"
    command: "python scripts/extract_env_vars.py"
    output: "docs/env-vars.md"
    description: "Extracts environment variable documentation"

  - name: "Compose Services Extractor"
    command: "python scripts/extract_compose_services.py"
    output: "docs/compose-services.md"
    description: "Extracts Docker Compose services list"

# Verification commands: Commands to verify documentation quality
verification_commands:
  - name: "Doc Build"
    command: "mkdocs build --strict"
    description: "Builds the documentation and checks for errors"

  - name: "Doc Lint"
    command: "pymdown-lint docs/**/*.md"
    description: "Lints all Markdown files in the docs directory"

  - name: "Link Check"
    command: "lychee docs/**/*.md"
    description: "Checks for broken links in documentation"

  - name: "Unit Tests Subset"
    command: "pytest tests/doc_tests/ -v"
    description: "Runs a subset of unit tests related to documentation"