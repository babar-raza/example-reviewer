matches:
  # ============================================================
  # 0) CONTRACT + BASELINE (keep later prompts short)
  # ============================================================
  - trigger: ":sonnet_rv00_contract"
    replace: |
      SONNET ROLE: Repo Surgeon + Evidence Runner
      GOAL: Prepare a minimal, enforced contract for runtime validation work, then capture a baseline snapshot of the repo reality (missing files, mismatched docs/specs, current pipeline behavior) WITHOUT doing big refactors yet.

      Non-negotiable rules:
      - Evidence-first: every claim must reference repo paths + command outputs.
      - Small increments: change -> run -> evidence -> commit.
      - Do not clobber existing docs/specs: append a dated note or update only wrong sections.
      - Any failure in CLI init-db/discover/validate must be fixed or clearly documented.

      Work dir / evidence:
      - Create: reports/runtime_validation/
      - Write these files:
        1) reports/runtime_validation/CONTRACT.md
        2) reports/runtime_validation/BASELINE.md

      CONTRACT.md must define (short bullets):
      - Runtime validation definition (compile + execute + assertions)
      - Status semantics (strict vs lenient)
      - Patch gating rule: never patch content before runtime passes (if runtime enabled)
      - Timeout + kill-tree expectation
      - Sample staging + alias mapping policy
      - Minimal acceptance checks for each phase

      BASELINE.md must include:
      - List missing critical runtime prerequisites (schema.sql, config/families, etc) with exact paths
      - Current pipeline summary (compile-only, early-return verified paths, immediate patch callback)
      - Current docs/specs mismatches you can prove by reading files (cite paths + snippets)

      Commands to run and paste outputs (or explain why cannot run):
      - ls -la (repo root), confirm absence/presence of schema.sql and config/
      - python -c "import requests, frontmatter" (will likely fail today; record it)
      - python -m src.cli init-db (expected to fail today; record it)
      - grep references: schema.sql + config/families + runtime_validation in repo (record key hits)

      Do NOT implement fixes in this prompt beyond creating the two reports.
      Stop-the-line if you accidentally start editing production code: revert those edits.

  # ============================================================
  # 1) BOOTSTRAP: schema.sql + config/families + deps + tiny content
  # ============================================================
  - trigger: ":sonnet_rv01_bootstrap"
    replace: |
      SONNET ROLE: Bootstrapper (make repo runnable) + Evidence Runner
      Follow reports/runtime_validation/CONTRACT.md.

      GOAL: Make the repo runnable end-to-end for a tiny ZIP sample: init-db -> discover -> validate (compile). This phase fixes the "missing prerequisites" gaps:
      - Add schema.sql at repo root that matches src/core/database.py actual tables/columns
      - Add config/families/zip.json (canonical format) so CLI works
      - Add minimal Python deps files so imports work (requests + frontmatter at minimum)
      - Add minimal content/ with 1 English ZIP page containing 1-2 C# snippets so discovery finds something

      Allowed edits (only):
      - schema.sql (new, repo root)
      - config/families/zip.json (new)
      - requirements.txt (new)
      - requirements-dev.txt (new, optional)
      - content/blog.aspose.net/zip/runtime-smoke/index.md (new)
      - docs/* (only update sections that are now objectively wrong about paths/commands; keep changes minimal)
      - specs/database-schema.md (update to reflect sqlite3 + actual schema in schema.sql; remove SQLAlchemy claims)

      Implementation details:
      1) Create schema.sql that defines ALL tables referenced by src/core/database.py:
         - pages, snippets, snippet_versions, runs, run_events, snippet_issues, fixes_applied, build_attempts, fix_sessions,
           gists, gist_files, gist_publications, rollback_history
         Include reasonable indexes + foreign keys consistent with queries.
         Keep schema aligned to field names in dataclasses in database.py.

      2) Create config/families/zip.json in canonical format per src/core/config_utils.py expectations.
         Minimal required keys:
         - "family": "zip"
         - "nuget_config": { "primary_package": { "name": "Aspose.Zip", "version_strategy": "latest_stable" }, "target_frameworks": ["net8.0"], "additional_packages": [] }
         - "code_defaults": { "default_usings": ["Aspose.Zip", "Aspose.Zip.Saving", "Aspose.Zip.Archive"] } (keep minimal, can be empty)
         - "patterns": [] (ok)
         - "non_existent_apis": [] (ok)
         Also add "content_pattern" so discovery reliably finds our smoke page for blog only:
         - "content_pattern": { "blog": "zip/**/index.md" }

      3) Create requirements.txt with:
         - requests
         - python-frontmatter
         Also add requirements-dev.txt with:
         - pytest
         - pytest-timeout (optional)

      4) Create content/blog.aspose.net/zip/runtime-smoke/index.md with 2 snippets:
         - Snippet A: a small ZIP creation that should compile (and later run) using MemoryStream + Archive + Save
         - Snippet B: an intentionally risky snippet (disposed stream before Save) but comment it out for now; keep it present for later runtime tests.

      Evidence:
      - Write reports/runtime_validation/PHASE1_BOOTSTRAP.md containing:
        - files created + why
        - commands run + outputs (paste)
      Commands (run and capture output):
      - python -m pip install -r requirements.txt
      - python -m src.cli init-db
      - python -m src.cli discover zip --max-pages 5
      - python -m src.cli validate zip --max-snippets 5 (if validate command exists; otherwise run whatever CLI supports; if missing, document)

      If CLI lacks validate command, implement ONLY the missing CLI wiring needed to validate snippets for this smoke scenario, but keep it minimal and documented.

      Commit:
      - Make a single commit: "Bootstrap: schema.sql + zip config + deps + smoke content"

  # ============================================================
  # 2) RUNTIME RUNNER: compile+execute with timeout + kill-tree
  # ============================================================
  - trigger: ":sonnet_rv02_runtime_runner"
    replace: |
      SONNET ROLE: Runtime Harness Engineer + Evidence Runner
      Follow reports/runtime_validation/CONTRACT.md.

      GOAL: Add runtime execution capability for snippets (compile+execute) with safety:
      - timeout enforcement
      - process tree termination
      - isolated workdir
      - machine-readable result (JSON)
      Then store results in DB table execution_results.

      Allowed edits:
      - src/validation/workspace/workspace_manager.py
      - the generated .NET validator project code under workspaces/<family>/validator is generated at runtime; instead modify the generator in workspace_manager.py so it emits updated Program.cs/Validator behavior.
      - src/core/database.py (add methods)
      - schema.sql (extend)
      - docs/testing-guide.md (minimal update: how to run runtime validation smoke)
      - specs/database-schema.md (add execution_results)

      Implementation plan:
      A) Extend schema.sql:
         - Add execution_results table as per plans/runtime_validation_plan.md intent:
           Columns: execution_id PK, snippet_id FK, run_id FK, success, exit_code, duration_ms, stdout, stderr, exception_type, exception_message, stack_trace,
                    output_files_json, memory_peak_kb (optional), created_at default now.
           Indexes: (snippet_id, run_id), (success), (created_at)

      B) Add Database methods in src/core/database.py:
         - create_execution_result(...)
         - get_latest_execution_result(snippet_id, optional run_id)
         - (optional) summarize execution failures by family via join snippets/pages

      C) Implement runtime executor:
         Option 1 (preferred for minimal churn): extend Validator Program.cs generator to support modes:
           - "compile": current behavior (prints SUCCESS / ERRORS)
           - "exec": compiles and then executes EntryPoint inside the same process OR runs emitted assembly in a child process
         Output for exec mode must be a single JSON line with fields matching DB columns.
         Ensure:
         - If snippet was wrapped, it has a Main so execution is meaningful.
         - Capture exceptions and stack trace.
         - Capture stdout and stderr separately.
         - Emit output_files_json by scanning working directory before/after (simple list).
         - Respect provided workdir path argument.

      D) Add WorkspaceManager.execute_code(code: str, exec_params: dict) -> (success: bool, exec_json: dict, raw_output: str)
         - It should:
           - create temp code file
           - create a temp execution workdir under workspaces_root/<family>/execution/<uuid>/
           - stage files if exec_params says so (leave staging logic minimal here; phase 4 enhances it)
           - run validator in exec mode with timeout
           - enforce kill-tree on timeout (Windows and Linux):
             - On Windows: use creationflags=CREATE_NEW_PROCESS_GROUP and then taskkill /T /F fallback
             - On Linux: start new process group (preexec_fn=os.setsid) and killpg on timeout
           - return structured result

      Evidence:
      - Write reports/runtime_validation/PHASE2_RUNTIME_RUNNER.md:
        - design notes
        - command outputs
      Commands:
      - python -m src.cli init-db (fresh db OK)
      - python -m src.cli discover zip --max-pages 5
      - Run one snippet through execute_code path (add a tiny one-off script under reports/runtime_validation/tmp_run_exec.py if needed, then delete it; prefer a minimal CLI hook if already present)
      - Confirm execution_results row created with sane fields

      Commit:
      - "Runtime: execution_results + validator exec mode + WorkspaceManager.execute_code"

  # ============================================================
  # 3) ORCHESTRATOR INTEGRATION: remove early returns, defer patching
  # ============================================================
  - trigger: ":sonnet_rv03_orchestrator_integration"
    replace: |
      SONNET ROLE: Pipeline Surgeon + Evidence Runner
      Follow reports/runtime_validation/CONTRACT.md.

      GOAL: Integrate runtime validation into ValidationOrchestrator correctly:
      - Remove "early return on compile success" so runtime can run for verified candidates
      - Make runtime validation optional and config-driven
      - Ensure patching is deferred until after runtime passes (when runtime enabled)
      - Ensure status semantics are enforced (strict default for runtime-enabled snippets)

      Allowed edits:
      - src/validation/orchestrator.py
      - src/core/database.py (if you need small helpers)
      - config/families/zip.json (add runtime_validation section)
      - docs/llm-code-fixing-flow.md and/or docs/architecture.md (ONLY the parts impacted)
      - plans/runtime_validation_plan.md (append a dated "Implementation Notes" section; do not rewrite whole plan)

      Requirements:
      1) Add config section to zip.json:
         "runtime_validation": {
            "enabled": true,
            "mode": "strict",              # strict|lenient
            "timeout_seconds": 10,
            "required_files": [],          # phase 4 will populate
            "file_aliases": {},            # phase 4 will populate
            "expected_outputs": ["*.zip"], # minimal assertion (can be empty for now)
            "env": {}
         }

      2) Refactor validate_snippet() flow:
         - Make a single "verified_candidate" object when compilation succeeds (original/fixed/ollama).
         - Do NOT return immediately when compilation succeeds.
         - If runtime_validation.enabled:
             - call workspace.execute_code(final_code, params)
             - store execution_results via Database
             - strict mode:
                 - if runtime fails: set snippet status to needs-fix and set message accordingly
                 - do NOT patch
             - lenient mode:
                 - keep verified but add warning fields and do NOT patch unless explicit allow flag exists
         - Only after runtime passes (or runtime disabled) do:
             - update snippet status to verified
             - allow patching (immediate patch callback must be disabled or deferred)

      3) Immediate patching callback:
         - If persistent_fix.enable_immediate_patching is true, still do NOT patch until runtime passes when runtime enabled.
         - Implement by changing callback strategy: store pending patch intent, apply at end after runtime success.

      Evidence:
      - reports/runtime_validation/PHASE3_ORCHESTRATOR.md
      Commands:
      - Run discover + validate on smoke content and show:
        - compile success path still works
        - runtime executes when enabled
        - patching does not run before runtime pass

      Commit:
      - "Pipeline: runtime stage integration + patch gating + no early returns"

  # ============================================================
  # 4) SAMPLES + ALIASES + ASSERTIONS (avoid false failures)
  # ============================================================
  - trigger: ":sonnet_rv04_samples_and_assertions"
    replace: |
      SONNET ROLE: Sample Harness Builder + Evidence Runner
      Follow reports/runtime_validation/CONTRACT.md.

      GOAL: Reduce runtime false failures by staging sample inputs + aliases and adding minimal output assertions.

      Allowed edits:
      - test-data/zip/** (new)
      - config/families/zip.json (fill runtime_validation.required_files, file_aliases, expected_outputs)
      - src/validation/workspace/workspace_manager.py (enhance staging + output scanning only)
      - docs/testing-guide.md (add "runtime samples" section)

      Build the ZIP sample pack:
      - Create folder: test-data/zip/
      - Include:
        - sample_dir/ (2-3 small text files; include nested folder)
        - sample.zip (zip containing sample_dir contents) OR generate it in code if you prefer, but commit the file if small
        - manifest.json with sha256 + size for each file
      - Keep binaries tiny.

      Staging rules (implement in execute_code):
      - If config says required_files includes "sample.zip" or "sample_dir", copy from test-data/zip into the execution workdir.
      - Apply file_aliases:
        Example:
          "sample.zip": ["input.zip", "archive.zip", "example.zip"]
          "sample_dir": ["input", "data", "sourceDir"]
        Create copies/symlinks as appropriate (on Windows, do copies).

      Assertions:
      - expected_outputs patterns evaluated against execution workdir:
        - at least one match exists
        - matched files size > 0
      - For ZIP outputs: add a lightweight verification step:
        - attempt to open produced zip via Aspose.Zip in a tiny verifier snippet OR just ensure file exists now (keep minimal; deeper verification can be phase 5+)

      Evidence:
      - reports/runtime_validation/PHASE4_SAMPLES.md:
        - list of committed sample files + manifest hashes
        - example execution workdir snapshot (list files)
        - show alias mapping prevented FileNotFoundException in at least one scenario (create a snippet variant in smoke page that references input.zip)

      Commit:
      - "Runtime: zip samples + alias staging + expected output assertions"

  # ============================================================
  # 5) TESTS + DOCS/SPECS SURGICAL SYNC (prove runtime catches bugs)
  # ============================================================
  - trigger: ":sonnet_rv05_tests_docs_specs"
    replace: |
      SONNET ROLE: Test Engineer + Doc Surgeon + Evidence Runner
      Follow reports/runtime_validation/CONTRACT.md.

      GOAL: Add minimal automated tests that prove the runtime layer catches what compilation cannot, and surgically sync docs/specs.

      Allowed edits:
      - tests/** (new)
      - pyproject.toml OR pytest.ini (new; choose minimal approach)
      - docs/** (surgical)
      - specs/** (surgical)
      - content/blog.aspose.net/zip/runtime-smoke/index.md (adjust snippets for test cases)

      Tests to add (minimum set):
      1) test_cli_init_db_creates_tables
         - run Database.initialize_schema(schema.sql) in temp dir, assert key tables exist including execution_results.
      2) test_discovery_finds_smoke_page_and_snippets
         - point DiscoveryService at repo root, run discover_family('zip', max_pages=5), assert snippets_found >= 1
      3) test_runtime_exec_success_creates_execution_result
         - validate snippet that should run and produce an output zip; assert execution_results.success=1 and expected output exists
      4) test_runtime_exec_catches_disposed_stream
         - include a snippet that compiles but throws at runtime (disposed stream before Save)
         - assert compilation verified candidate would exist but runtime marks needs-fix (strict mode) and execution_results captures exception
      5) test_timeout_kills_hung_snippet
         - snippet that sleeps or loops; assert timeout triggers and no orphan process remains (best-effort assertion: execution_results.success=0 and duration near timeout)

      Implementation guidance:
      - Keep tests fast (under ~10-15s total).
      - Use temp dirs for db and workspaces; do not pollute repo state.
      - If dotnet build makes tests slow, mark runtime tests as "integration" and allow running separately (still included).

      Docs/specs surgical sync:
      - Update specs/database-schema.md to match actual SQLite schema (remove SQLAlchemy claims).
      - Update docs/testing-guide.md with:
        - how to install deps
        - how to run pytest
        - how runtime samples work
      - Update README.md minimally so it no longer describes scripts/example-reviewer layout if that is obsolete; replace only the incorrect sections.

      Evidence:
      - reports/runtime_validation/PHASE5_TESTS_DOCS.md containing:
        - pytest command outputs
        - one example of compile-pass/runtime-fail captured
      Commands:
      - python -m pip install -r requirements.txt
      - python -m pip install -r requirements-dev.txt
      - pytest -q  (or python -m pytest -q)

      Commit:
      - "Tests+Docs: runtime validation coverage + schema/spec alignment"
