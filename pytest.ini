[pytest]
# Pytest configuration for Example Reviewer test suite

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts = -v
console_output_style = progress

# Disable pytest warnings for cleaner output
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Usage:
# Run all tests EXCEPT integration: pytest (default)
# Run WITH integration tests: pytest --integration
# Run ONLY integration tests: pytest -m integration --integration
