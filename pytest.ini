[pytest]
# Pytest configuration for Example Reviewer test suite

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests
norecursedirs = tests/legacy_root

# Output options
addopts = -v
console_output_style = progress
asyncio_default_fixture_loop_scope = function

# Custom markers
markers =
    integration: Integration tests requiring real GitHub API access
    runtime: Runtime validation tests that execute compiled C# code
    slow: Tests that take longer than 5 seconds
    fallback: Circuit breaker and degraded-mode scenarios (KB errors, LLM fallback, Ollama routing)

# Run only fallback tests: pytest -m fallback
# Disable pytest warnings for cleaner output
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Usage:
# Run all tests EXCEPT integration: pytest (default)
# Run WITH integration tests: pytest --integration
# Run ONLY integration tests: pytest -m integration --integration
# Run ONLY runtime tests: pytest -m runtime
