version: "3.9"

services:
  example-reviewer:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "18800:18800"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    environment:
      - DB_PATH=/app/data/example_reviewer.db
      - CONFIG_DIR=/app/config/families
      - WORKSPACE_DIR=/app/workspace
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:18800/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
