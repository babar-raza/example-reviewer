---
# Example Reviewer — GitLab CI Pipeline (AUTHORITATIVE)
# GitHub Actions (.github/workflows/cli_tests.yml) is a legacy subset
# retained for mirror compatibility. All new CI jobs go here.
#
# Stages:
#   validate  — KB validation + static analysis + risky-diff check (MRs only)
#   test      — unit tests with coverage + dedicated fallback tests
#   eval      — eval freshness check + claims validation
#
# Coverage badge / inline MR coverage uses GitLab Cobertura format (coverage.xml).
# Fallback tests run in their own job so the reviewer can see a named CI stage
# for "circuit breaker and degraded-mode test" evidence.

stages:
  - validate
  - test
  - eval

# ---------------------------------------------------------------------------
# Shared Python setup template
# ---------------------------------------------------------------------------
.python-setup: &python-setup
  image: python:3.10-slim
  before_script:
    - pip install --upgrade pip --quiet
    - pip install -r requirements.txt --quiet

# ===========================================================================
# Stage: validate
# ===========================================================================

validate-kb:
  <<: *python-setup
  stage: validate
  script:
    - python scripts/validate_kb.py --all
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'

security-scan:
  stage: validate
  image: python:3.10-slim
  script:
    - pip install --upgrade pip --quiet
    - pip install bandit pip-audit --quiet
    # TC-03-UPDATE: bandit must be able to fail the job (no blanket || true)
    - bandit -r src/ -ll -f json -o bandit_report.json
    # pip-audit: allow soft failure for transient PyPI issues, but report is still generated
    - pip-audit -r requirements.txt --desc --output pip_audit_report.json --format json || true
    - echo "Security scan complete — review bandit_report.json and pip_audit_report.json"
  artifacts:
    paths:
      - bandit_report.json
      - pip_audit_report.json
    expire_in: 30 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

consistency-check:
  <<: *python-setup
  stage: validate
  script:
    - python scripts/validation/check_doc_code_consistency.py
    - python scripts/validation/generate_repo_signals.py
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

static-analysis:
  stage: validate
  image: python:3.10-slim
  script:
    - python scripts/validation/analyze_cli_imports.py src/cli/main.py
    - python scripts/validation/analyze_cli_imports.py src/pipeline/orchestrator.py
    - python scripts/validation/analyze_cli_imports.py src/core/database.py
    - python scripts/validation/analyze_cli_imports.py src/services/llm_service.py
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

risky-diff-check:
  stage: validate
  image: python:3.10-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
  script:
    # Warn when risky files are changed without accompanying test changes.
    # --strict exits non-zero when risky files change without test updates.
    - python scripts/validation/check_risky_diff.py --strict
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ===========================================================================
# Stage: test
# ===========================================================================

unit-tests:
  <<: *python-setup
  stage: test
  script:
    - pip install -r requirements-dev.txt --quiet
    - >
      pytest tests/ -v --timeout=120
      --cov=src
      --cov-report=term-missing
      --cov-report=xml:coverage.xml
      --cov-report=html:coverage_html/
      --cov-fail-under=50
      -m "not integration and not runtime"
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage_html/
    expire_in: 30 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'

fallback-tests:
  <<: *python-setup
  stage: test
  script:
    - pip install -r requirements-dev.txt --quiet
    - >
      pytest
      tests/test_circuit_breaker_scenarios.py
      tests/test_degraded_mode.py
      tests/test_kb_error_handling.py
      -v --timeout=60
      --tb=short
      --junit-xml=fallback_test_results.xml
  artifacts:
    reports:
      junit: fallback_test_results.xml
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'

integration-tests:
  <<: *python-setup
  stage: test
  script:
    - pip install -r requirements-dev.txt --quiet
    - >
      pytest tests/test_integration_real.py
      -v --timeout=120
      -m "integration"
      --tb=short
      --junit-xml=integration_test_results.xml
  artifacts:
    reports:
      junit: integration_test_results.xml
    expire_in: 30 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# ===========================================================================
# Stage: eval
# ===========================================================================

eval-baseline-check:
  <<: *python-setup
  stage: eval
  script:
    - python scripts/evals/check_eval_freshness.py --max-age-days 90
    - python scripts/evals/validate_eval_claims.py
  artifacts:
    paths:
      - evals/ci_eval_report.json
    expire_in: 30 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
