name: CLI Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  validate-kb:
    name: Validate Family KB Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate KB files
        run: python scripts/validate_kb.py --all

  static-analysis:
    name: Static Import Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run static import analyzer on CLI
        run: python scripts/validation/analyze_cli_imports.py src/cli/main.py

      - name: Analyze orchestrator imports
        run: python scripts/validation/analyze_cli_imports.py src/pipeline/orchestrator.py

      - name: Analyze database imports
        run: python scripts/validation/analyze_cli_imports.py src/core/database.py

      - name: Analyze LLM service imports
        run: python scripts/validation/analyze_cli_imports.py src/services/llm_service.py

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest tests/ -v --timeout=120 -x
